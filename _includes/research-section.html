<section class="research-section" id="{{ include.id }}" data-scale-label="{{ include.scale_indicator }}">
  {% if include.canvas_variant %}
  <canvas class="canvas-bg" data-variant="{{ include.canvas_variant }}"></canvas>
  {% endif %}
  <div class="container">
    <p class="research-section__scale">{{ include.scale }}</p>
    <h2 class="research-section__title">{{ include.title }}</h2>

    {% if include.image %}
    <figure class="research-section__visual">
      <img src="{{ include.image | relative_url }}" alt="{{ include.image_alt }}">
    </figure>
    {% endif %}

    <button type="button" class="research-section__toggle" aria-pressed="false">Plain-language version</button>

    <div class="research-section__register research-section__register--technical">
      {{ include.technical }}
    </div>
    <div class="research-section__register research-section__register--plain" hidden>
      {{ include.plain }}
    </div>

    {% if include.note %}
    <details class="research-section__note">
      <summary>What didn't work</summary>
      <p>{{ include.note }}</p>
    </details>
    {% endif %}
  </div>
</section>
